# OpenFactory Redis 基线配置（Celery broker / 结果后端）
# 由 deploy/scripts/bootstrap-runtime.sh 渲染到 @RUNTIME_DIR@/etc/redis.conf。
# 预算：maxmemory 256MB（见 docs/planning/resource-plan.md §2）。

bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# 由 systemd 托管，禁止自行 daemonize
daemonize no
supervised systemd
pidfile @RUNTIME_DIR@/run/redis.pid

loglevel notice
logfile ""
databases 16
always-show-logo no
set-proc-title yes

# 工作目录（bootstrap 会创建 data/redis）
dir @RUNTIME_DIR@/data/redis

# 内存红线：队列数据不淘汰，宁可写入失败也不静默丢任务
maxmemory 256mb
maxmemory-policy noeviction

# 队列 / 缓存数据可重建，关闭持久化以节省磁盘与 fork 抖动
save ""
appendonly no
